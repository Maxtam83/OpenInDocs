# OpenInDocs settings / Réglages
# After installation this file lives in %LOCALAPPDATA%\OpenInDocs\ . Changes apply at the next double-click, no reinstall needed.
# Après installation, ce fichier se trouve dans %LOCALAPPDATA%\OpenInDocs\ ; les modifications sont prises en compte au prochain double-clic.

# Folder inside "My Drive" where files opened from the PC are copied (sub-folders allowed: A\B)
# Dossier de « Mon Drive » où sont copiés les fichiers ouverts depuis le PC (sous-dossiers possibles : A\B)
TargetFolder=@TARGET@

# Google account to use when several accounts are signed in to your browser (e.g. firstname.lastname@gmail.com)
# Compte Google à utiliser si plusieurs comptes sont connectés dans le navigateur
GoogleAccount=

# How long to wait for Google Drive to upload the file, in seconds
# Attente maximale de l'envoi vers Google Drive, en secondes
MaxWaitSeconds=90

# Location of "My Drive"; leave empty for automatic detection (e.g. G:\My Drive)
# Emplacement de « Mon Drive » ; laisser vide pour la détection automatique
DriveRoot=
